<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<title>Edit game</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif}
a{color:#8AB4FF}a:hover{color:#B5CEFF}
button{font-family:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #FFFFFF;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0E0E11; color: #F4F4F6; padding: 58px 16px 34px; display: flex; flex-direction: column; gap: 10px">

  <div style="display: flex; align-items: center; gap: 10px">
    <a href="NewGame.dc.html" aria-label="Back" style="width: 48px; height: 48px; border-radius: 24px; background: #1E1E23; color: #F4F4F6; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg>
    </a>
    <h1 style="margin: 0; font-size: 24px; font-weight: 800; flex-grow: 1">Edit game</h1>
    <a href="ImportPreset.dc.html" aria-label="Share this game" style="height: 48px; border-radius: 24px; background: #1E1E23; color: #F4F4F6; padding: 0 16px; display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 600; text-decoration: none">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 8l5-5 5 5"></path><path d="M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"></path></svg>
      Share
    </a>
  </div>

  <label style="display: flex; flex-direction: column; gap: 6px; padding: 0 4px">
    <span style="font-size: 13px; font-weight: 600; color: #A1A1AA; letter-spacing: 0.04em; text-transform: uppercase">Name</span>
    <input type="text" value="Dutch Blitz" style="height: 52px; border-radius: 14px; border: 1px solid #3A3A42; background: #1A1A1F; color: #F4F4F6; padding: 0 14px; font-size: 18px; font-weight: 600; font-family: inherit; box-sizing: border-box">
  </label>

  <div style="background: #1A1A1F; border: 1px solid #2C2C33; border-radius: 18px; padding: 4px 14px; display: flex; flex-direction: column">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="3">
      <div role="group" aria-label="{{r.label}}" style="display: flex; flex-direction: column; gap: 6px; padding: 9px 0; border-top: {{r.border}}">
        <span style="font-size: 15px; font-weight: 600">{{r.label}}</span>
        <div style="display: flex; background: #0E0E11; border-radius: 12px; padding: 3px; gap: 3px">
          <sc-for list="{{r.opts}}" as="o" hint-placeholder-count="3">
            <button aria-pressed="{{o.on}}" style="{{o.style}}">{{o.text}}</button>
          </sc-for>
        </div>
      </div>
    </sc-for>
  </div>

  <div style="background: #1A1A1F; border: 1px solid #2C2C33; border-radius: 18px; padding: 0 14px; display: flex; flex-direction: column">
    <div style="display: flex; align-items: center; justify-content: space-between; height: 60px">
      <span style="font-size: 15px; font-weight: 600">Target score</span>
      <div style="display: flex; align-items: center; gap: 4px">
        <button aria-label="Lower target" style="width: 44px; height: 44px; border-radius: 12px; border: 0; background: #2A2A31; color: #F4F4F6; font-size: 22px">−</button>
        <span style="width: 64px; text-align: center; font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums">100</span>
        <button aria-label="Raise target" style="width: 44px; height: 44px; border-radius: 12px; border: 0; background: #2A2A31; color: #F4F4F6; font-size: 22px">+</button>
      </div>
    </div>
    <div style="display: flex; align-items: center; justify-content: space-between; min-height: 60px; border-top: 1px solid #26262C; gap: 10px">
      <span style="font-size: 15px; font-weight: 600">Quick buttons</span>
      <div style="display: flex; gap: 6px">
        <span style="height: 36px; border-radius: 10px; background: #2A2A31; padding: 0 10px; display: flex; align-items: center; font-size: 15px; font-weight: 700">+1</span>
        <span style="height: 36px; border-radius: 10px; background: #2A2A31; padding: 0 10px; display: flex; align-items: center; font-size: 15px; font-weight: 700">+5</span>
        <span style="height: 36px; border-radius: 10px; background: #2A2A31; padding: 0 10px; display: flex; align-items: center; font-size: 15px; font-weight: 700">−2</span>
        <button aria-label="Edit quick buttons" style="width: 36px; height: 36px; border-radius: 10px; border: 1.5px dashed #52525B; background: transparent; color: #E5E5EA; font-size: 18px">+</button>
      </div>
    </div>
    <div style="display: flex; align-items: center; justify-content: space-between; height: 60px; border-top: 1px solid #26262C">
      <span style="display: flex; flex-direction: column"><span style="font-size: 15px; font-weight: 600">Round counter</span><span style="font-size: 12px; color: #A1A1AA">Off · rounds still saved to history</span></span>
      <button role="switch" aria-checked="false" aria-label="Show round counter" style="width: 56px; height: 34px; border-radius: 17px; border: 0; background: #3A3A42; padding: 3px; display: flex">
        <span style="width: 28px; height: 28px; border-radius: 14px; background: #F4F4F6"></span>
      </button>
    </div>
  </div>

  <div style="flex-grow: 1"></div>
  <div style="display: flex; gap: 8px">
    <button style="flex: 1 1 0; height: 48px; border-radius: 16px; border: 0; background: #1E1E23; color: #F4F4F6; font-size: 16px; font-weight: 600">Duplicate</button>
    <button style="flex: 1 1 0; height: 48px; border-radius: 16px; border: 0; background: #1E1E23; color: #FF9B9B; font-size: 16px; font-weight: 600">Delete</button>
  </div>
  <a href="NewGame.dc.html" style="height: 56px; border-radius: 20px; background: #F4F4F6; color: #0E0E11; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 700; text-decoration: none">Save</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var seg = function (texts, onIndex) {
      return texts.map(function (t, i) {
        var on = i === onIndex;
        return {
          text: t, on: on ? 'true' : 'false',
          style: 'flex: 1 1 0; height: 38px; border-radius: 9px; border: 0; font-size: 14px; font-weight: 700; '
            + (on ? 'background: #F4F4F6; color: #0E0E11' : 'background: transparent; color: #C4C4CC')
        };
      });
    };
    var rows = [
      { label: 'Winner has the', opts: seg(['Highest score', 'Lowest score'], 0) },
      { label: 'Game ends', opts: seg(['At target', 'After last round', 'Never'], 0) },
      { label: 'Show each round', opts: seg(['Dealer', 'First player', 'None'], 2) }
    ].map(function (r, i) { return Object.assign(r, { border: i === 0 ? '0' : '1px solid #26262C' }); });
    return { rows: rows };
  }
}
</script>
</body>
</html>
