<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<title>Group: Family</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif}
a{color:#8AB4FF}a:hover{color:#B5CEFF}
button{font-family:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid #FFFFFF;outline-offset:2px}
th,td{padding:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0E0E11; color: #F4F4F6; padding: 58px 16px 34px; display: flex; flex-direction: column; gap: 12px; font-variant-numeric: tabular-nums">

  <div style="display: flex; align-items: center; gap: 10px">
    <a href="NewGame.dc.html" aria-label="Back" style="width: 48px; height: 48px; border-radius: 24px; background: #1E1E23; color: #F4F4F6; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg>
    </a>
    <div style="display: flex; flex-direction: column; flex-grow: 1">
      <h1 style="margin: 0; font-size: 24px; font-weight: 800">Family</h1>
      <span style="font-size: 13px; color: #A1A1AA">5 players · 23 games since Aug</span>
    </div>
    <button style="height: 48px; border-radius: 24px; border: 0; background: #1E1E23; color: #F4F4F6; padding: 0 18px; font-size: 16px; font-weight: 600">Edit</button>
  </div>

  <div role="group" aria-label="Show stats for" style="display: flex; background: #1A1A1F; border-radius: 12px; padding: 3px; gap: 3px">
    <button aria-pressed="false" style="flex: 1 1 0; height: 40px; border-radius: 9px; border: 0; background: transparent; color: #C4C4CC; font-size: 14px; font-weight: 700">All games</button>
    <button aria-pressed="true" style="flex: 1 1 0; height: 40px; border-radius: 9px; border: 0; background: #F4F4F6; color: #0E0E11; font-size: 14px; font-weight: 700">5 Crowns</button>
    <button aria-pressed="false" style="flex: 1 1 0; height: 40px; border-radius: 9px; border: 0; background: transparent; color: #C4C4CC; font-size: 14px; font-weight: 700">Dutch Blitz</button>
  </div>

  <div style="background: #1A1A1F; border: 1px solid #2C2C33; border-radius: 18px; padding: 6px 12px">
    <table style="width: 100%; border-collapse: collapse">
      <caption style="position: absolute; width: 1px; height: 1px; overflow: hidden">5 Crowns stats for Family, 14 games</caption>
      <thead>
        <tr style="height: 36px; color: #A1A1AA; font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em">
          <th scope="col" style="text-align: left; font-weight: 600">Player</th>
          <th scope="col" style="text-align: right; font-weight: 600">Wins</th>
          <th scope="col" style="text-align: right; font-weight: 600">Win %</th>
          <th scope="col" style="text-align: right; font-weight: 600">Avg</th>
          <th scope="col" style="text-align: right; font-weight: 600">Best</th>
        </tr>
      </thead>
      <tbody>
        <sc-for list="{{stats}}" as="s" hint-placeholder-count="5">
          <tr style="height: 44px; border-top: 1px solid #26262C; font-size: 16px">
            <th scope="row" style="text-align: left; font-weight: 700"><span style="display: inline-flex; align-items: center; gap: 8px"><span style="width: 10px; height: 10px; border-radius: 5px; background: {{s.color}}"></span>{{s.name}}</span></th>
            <td style="text-align: right; font-weight: 800">{{s.wins}}</td>
            <td style="text-align: right; color: #E5E5EA">{{s.pct}}</td>
            <td style="text-align: right; color: #E5E5EA">{{s.avg}}</td>
            <td style="text-align: right; color: #E5E5EA">{{s.best}}</td>
          </tr>
        </sc-for>
      </tbody>
    </table>
  </div>

  <h2 style="margin: 4px 4px 0; font-size: 13px; font-weight: 600; color: #A1A1AA; letter-spacing: 0.04em; text-transform: uppercase">Past games</h2>
  <ul style="list-style: none; margin: 0; padding: 0; background: #1A1A1F; border: 1px solid #2C2C33; border-radius: 18px; overflow: hidden">
    <sc-for list="{{past}}" as="g" hint-placeholder-count="4">
      <li style="border-top: {{g.border}}">
        <a href="GameOver.dc.html" style="min-height: 60px; display: flex; align-items: center; gap: 12px; padding: 0 14px; color: #F4F4F6; text-decoration: none">
          <span style="display: flex; flex-direction: column; flex-grow: 1; gap: 2px">
            <span style="font-size: 16px; font-weight: 700">{{g.winner}} won · {{g.score}}</span>
            <span style="font-size: 13px; color: #A1A1AA">{{g.meta}}</span>
          </span>
          <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A1A1AA" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg>
        </a>
      </li>
    </sc-for>
  </ul>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var stats = [
      { name: 'Isaac', color: '#F59A4A', wins: 5, pct: '36%', avg: 88, best: 61 },
      { name: 'Kerryn', color: '#F37DB8', wins: 4, pct: '29%', avg: 92, best: 58 },
      { name: 'Marlies', color: '#F2D35E', wins: 3, pct: '21%', avg: 104, best: 70 },
      { name: 'Martin', color: '#B98AF6', wins: 2, pct: '14%', avg: 110, best: 74 },
      { name: 'Hedgehog', color: '#9CD873', wins: 0, pct: '0%', avg: 131, best: 97 }
    ];
    var past = [
      { winner: 'Isaac', score: '73', meta: '5 Crowns · Tue 4 Nov · 4 players' },
      { winner: 'Kerryn', score: '102', meta: 'Dutch Blitz · Sat 1 Nov · 5 players' },
      { winner: 'Kerryn & Martin', score: '81', meta: '5 Crowns · Sat 1 Nov · tie' },
      { winner: 'Marlies', score: '64', meta: '5 Crowns · Sun 26 Oct · 5 players' }
    ].map(function (g, i) { return Object.assign(g, { border: i === 0 ? '0' : '1px solid #26262C' }); });
    return { stats: stats, past: past };
  }
}
</script>
</body>
</html>
