<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<title>Edit player</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif}
a{color:#8AB4FF}a:hover{color:#B5CEFF}
button{font-family:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #FFFFFF;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0E0E11; color: #F4F4F6; padding: 58px 16px 34px; display: flex; flex-direction: column; gap: 14px">

  <div style="display: flex; align-items: center; gap: 10px">
    <a href="Phone.dc.html" aria-label="Back" style="width: 48px; height: 48px; border-radius: 24px; background: #1E1E23; color: #F4F4F6; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg>
    </a>
    <h1 style="margin: 0; font-size: 24px; font-weight: 800">Edit player</h1>
  </div>

  <div aria-hidden="true" style="background: {{color}}; color: #121214; border-radius: 20px; height: 84px; padding: 0 20px; display: flex; align-items: center; justify-content: space-between">
    <span style="font-size: 24px; font-weight: 700">Theo</span>
    <span style="font-size: 36px; font-weight: 800">9</span>
  </div>

  <label style="display: flex; flex-direction: column; gap: 6px; padding: 0 4px">
    <span style="font-size: 13px; font-weight: 600; color: #A1A1AA; letter-spacing: 0.04em; text-transform: uppercase">Name</span>
    <input type="text" value="Theo" maxlength="20" style="height: 52px; border-radius: 14px; border: 1px solid #3A3A42; background: #1A1A1F; color: #F4F4F6; padding: 0 14px; font-size: 18px; font-weight: 600; font-family: inherit; box-sizing: border-box">
  </label>

  <div role="radiogroup" aria-label="Colour" style="display: flex; flex-direction: column; gap: 8px; padding: 0 4px">
    <span style="font-size: 13px; font-weight: 600; color: #A1A1AA; letter-spacing: 0.04em; text-transform: uppercase">Colour</span>
    <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px">
      <sc-for list="{{swatches}}" as="s" hint-placeholder-count="12">
        <button role="radio" aria-checked="{{s.on}}" aria-label="{{s.name}}" onClick="{{s.pick}}" style="{{s.style}}">
          <sc-if value="{{s.selected}}" hint-placeholder-val="{{ false }}">
            <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#121214" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg>
          </sc-if>
        </button>
      </sc-for>
    </div>
    <span style="font-size: 13px; color: #A1A1AA">Colours in use by others in this game are fine. Names tell players apart.</span>
  </div>

  <div style="flex-grow: 1"></div>
  <button style="height: 50px; border-radius: 16px; border: 0; background: #1E1E23; color: #F4F4F6; font-size: 16px; font-weight: 600">Sit out this game</button>
  <button style="height: 50px; border-radius: 16px; border: 0; background: #1E1E23; color: #FF9B9B; font-size: 16px; font-weight: 600">Delete from Family…</button>
  <a href="Phone.dc.html" style="height: 56px; border-radius: 20px; background: #F4F4F6; color: #0E0E11; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 700; text-decoration: none">Done</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { pick: 1 }; }
  renderVals() {
    var self = this;
    var pal = [['Pink','#F37DB8'],['Orange','#F59A4A'],['Yellow','#F2D35E'],['Purple','#B98AF6'],['Green','#9CD873'],['Teal','#6CCFB4'],['Blue','#6FB2F7'],['Coral','#F28A80'],['Sand','#D9B38C'],['Silver','#B8C2CC'],['Lilac','#E3A6F0'],['Lime','#C6E36A']];
    var swatches = pal.map(function (p, i) {
      var on = i === self.state.pick;
      return { name: p[0], selected: on, on: on ? 'true' : 'false',
        style: 'aspect-ratio: 1; min-height: 48px; border-radius: 14px; border: 0; background: ' + p[1] + '; display: flex; align-items: center; justify-content: center; '
          + (on ? 'box-shadow: 0 0 0 3px #0E0E11, 0 0 0 6px #F4F4F6' : ''),
        pick: function () { self.setState({ pick: i }); } };
    });
    return { swatches: swatches, color: pal[this.state.pick][1] };
  }
}
</script>
</body>
</html>
