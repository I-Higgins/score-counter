<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<title>End round (iPad)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif}
a{color:#8AB4FF}a:hover{color:#B5CEFF}
button{font-family:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid #FFFFFF;outline-offset:2px}
</style>
</helmet>
<div style="width: 820px; height: 1180px; box-sizing: border-box; background: #0E0E11; color: #F4F4F6; padding: 40px 32px 32px; display: flex; flex-direction: column; gap: 20px; font-variant-numeric: tabular-nums">

  <div style="display: flex; align-items: center; gap: 14px">
    <a href="iPadScore.dc.html" aria-label="Cancel and go back" style="width: 56px; height: 56px; border-radius: 28px; background: #1E1E23; color: #F4F4F6; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
    </a>
    <div style="display: flex; flex-direction: column">
      <h1 style="margin: 0; font-size: 30px; font-weight: 800">End round 5</h1>
      <span style="font-size: 15px; color: #A1A1AA">Tap a player or use Next. Amounts tapped in during the round are already filled in.</span>
    </div>
  </div>

  <div style="display: flex; gap: 24px; flex-grow: 1; min-height: 0">
    <ol aria-label="Round scores" style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; flex: 1 1 0; min-width: 0">
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
        <li>
          <button onClick="{{r.pick}}" aria-label="{{r.aria}}" style="{{r.style}}">
            <span style="width: 14px; height: 44px; border-radius: 7px; background: {{r.color}}; flex-shrink: 0"></span>
            <span style="display: flex; flex-direction: column; align-items: flex-start; flex-grow: 1; min-width: 0">
              <span style="font-size: 21px; font-weight: 700">{{r.name}}</span>
              <span style="font-size: 14px; color: #A1A1AA">Total {{r.total}} → {{r.after}}</span>
            </span>
            <span style="font-size: 34px; font-weight: 800; min-width: 80px; text-align: right">{{r.value}}</span>
          </button>
        </li>
      </sc-for>
    </ol>

    <div style="width: 340px; flex-shrink: 0; display: flex; flex-direction: column; gap: 12px">
      <div aria-live="polite" style="background: #1A1A1F; border: 1px solid #2C2C33; border-radius: 20px; padding: 16px 20px; display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 14px; color: #A1A1AA">Entering for</span>
        <span style="font-size: 26px; font-weight: 800">{{selName}}</span>
      </div>
      <div role="group" aria-label="Number pad" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
        <sc-for list="{{keys}}" as="k" hint-placeholder-count="12">
          <button onClick="{{k.press}}" aria-label="{{k.aria}}" style="height: 84px; border-radius: 18px; border: 0; background: #2A2A31; color: #F4F4F6; font-size: 32px; font-weight: 600">{{k.label}}</button>
        </sc-for>
      </div>
      <div style="flex-grow: 1"></div>
      <sc-if value="{{notLast}}" hint-placeholder-val="{{ true }}">
        <button onClick="{{next}}" style="height: 68px; border-radius: 20px; border: 0; background: #F4F4F6; color: #0E0E11; font-size: 20px; font-weight: 700">Next: {{nextName}}</button>
      </sc-if>
      <sc-if value="{{isLast}}" hint-placeholder-val="{{ false }}">
        <a href="iPadScore.dc.html" style="height: 68px; border-radius: 20px; background: #F4F4F6; color: #0E0E11; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 700; text-decoration: none">Save round · start round 6</a>
      </sc-if>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":820,"height":1180}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      players: [
        { name: 'Hedgehog', color: '#9CD873', total: -4, entry: '0' },
        { name: 'Isaac', color: '#F59A4A', total: 9, entry: '5' },
        { name: 'Martin', color: '#B98AF6', total: 9, entry: '' },
        { name: 'Kerryn', color: '#F37DB8', total: 14, entry: '' },
        { name: 'Marlies', color: '#F2D35E', total: 22, entry: '' },
        { name: 'Panda', color: '#6CCFB4', total: 28, entry: '' }
      ],
      sel: 2
    };
  }
  setEntry(fn) {
    var sel = this.state.sel;
    this.setState({ players: this.state.players.map(function (p, i) { return i === sel ? Object.assign({}, p, { entry: fn(p.entry) }) : p; }) });
  }
  renderVals() {
    var s = this.state, self = this;
    var fmt = function (n) { return n < 0 ? '−' + Math.abs(n) : '' + n; };
    var rows = s.players.map(function (p, i) {
      var n = p.entry === '' || p.entry === '-' ? 0 : parseInt(p.entry, 10);
      var on = i === s.sel;
      return {
        name: p.name, color: p.color, total: fmt(p.total), after: fmt(p.total + n),
        value: p.entry === '' ? '—' : p.entry.replace('-', '−'),
        aria: p.name + ', round score ' + (p.entry === '' ? 'not entered' : p.entry) + (on ? ', editing' : ''),
        style: 'width: 100%; height: 80px; border-radius: 18px; display: flex; align-items: center; gap: 14px; padding: 0 20px 0 14px; color: #F4F4F6; text-align: left; box-sizing: border-box; '
          + (on ? 'background: #2A2A31; border: 2px solid #F4F4F6' : 'background: #1A1A1F; border: 2px solid transparent'),
        pick: function () { self.setState({ sel: i }); }
      };
    });
    var digit = function (d) { return function () { self.setEntry(function (e) { var v = (e === '0' ? '' : e) + d; return v.replace(/^(-?)0+(\d)/, '$1$2'); }); }; };
    var keys = ['1','2','3','4','5','6','7','8','9'].map(function (d) { return { label: d, aria: d, press: digit(d) }; });
    keys.push({ label: '±', aria: 'Make negative or positive', press: function () { self.setEntry(function (e) { return e.charAt(0) === '-' ? e.slice(1) : '-' + e; }); } });
    keys.push({ label: '0', aria: '0', press: digit('0') });
    keys.push({ label: '⌫', aria: 'Delete', press: function () { self.setEntry(function (e) { return e.slice(0, -1); }); } });
    var last = s.sel >= s.players.length - 1;
    return {
      rows: rows, keys: keys, isLast: last, notLast: !last, selName: s.players[s.sel].name,
      nextName: last ? '' : s.players[s.sel + 1].name,
      next: function () { self.setState({ sel: Math.min(s.players.length - 1, s.sel + 1) }); }
    };
  }
}
</script>
</body>
</html>
