<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<title>Scoreboard</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif}
a{color:#8AB4FF}a:hover{color:#B5CEFF}
button{font-family:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid #FFFFFF;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0E0E11; color: #F4F4F6; padding: 58px 16px 34px; display: flex; flex-direction: column; gap: 12px; font-variant-numeric: tabular-nums; position: relative; overflow: hidden">

  <div style="display: flex; align-items: center; gap: 8px">
    <button aria-label="Menu" style="width: 48px; height: 48px; flex-shrink: 0; border-radius: 24px; border: 0; background: #1E1E23; color: #F4F4F6; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"></path></svg>
    </button>
    <a href="NewGame.dc.html" aria-label="Change game. Current: 5 Crowns with Family" style="height: 48px; min-width: 0; flex-grow: 1; border-radius: 24px; background: #1E1E23; color: #F4F4F6; padding: 0 14px; display: flex; align-items: center; gap: 6px; text-decoration: none; box-sizing: border-box">
      <span style="display: flex; flex-direction: column; min-width: 0; line-height: 1.15">
        <span style="font-size: 16px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">5 Crowns</span>
        <span style="font-size: 12px; color: #A1A1AA">Family</span>
      </span>
      <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#A1A1AA" stroke-width="2.5" stroke-linecap="round"><path d="M6 9l6 6 6-6"></path></svg>
    </a>
    <button onClick="{{cycleSort}}" aria-label="{{sortAria}}" style="width: 48px; height: 48px; flex-shrink: 0; border-radius: 24px; border: 0; background: #1E1E23; color: #F4F4F6; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4v16M3 16l4 4 4-4M17 20V4M13 8l4-4 4 4"></path></svg>
    </button>
    <button onClick="{{undo}}" aria-label="Undo last change" style="width: 48px; height: 48px; flex-shrink: 0; border-radius: 24px; border: 0; background: #1E1E23; color: #F4F4F6; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"></path><path d="M4 9h11a5 5 0 0 1 0 10h-3"></path></svg>
    </button>
    <button aria-label="Add player" style="width: 48px; height: 48px; flex-shrink: 0; border-radius: 24px; border: 0; background: #1E1E23; color: #F4F4F6; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
    </button>
  </div>

  <section aria-label="Round" style="border-radius: 18px; background: #1A1A1F; border: 1px solid #2C2C33; padding: 10px 16px; display: flex; align-items: center; justify-content: space-between; gap: 10px">
    <span style="font-size: 20px; font-weight: 700">Round {{round}} <span style="color: #A1A1AA; font-weight: 600">of 13</span></span>
    <span style="font-size: 15px; font-weight: 600; color: #E5E5EA">{{round}} cards · {{wild}} wild</span>
  </section>

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 0 4px; height: 18px">
    <span style="font-size: 13px; color: #A1A1AA">{{sortLabel}} · totals include this round</span>
    <sc-if value="{{pending}}" hint-placeholder-val="{{ false }}">
      <span style="font-size: 13px; color: #E5E5EA">Re-sorting…</span>
    </sc-if>
  </div>

  <ol aria-label="Players" style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px">
    <sc-for list="{{players}}" as="p" hint-placeholder-count="5">
      <li style="background: {{p.color}}; color: #121214; border-radius: 20px; height: 84px; padding: 0 8px 0 12px; display: flex; align-items: center; gap: 8px; box-sizing: border-box">
        <span aria-label="Position {{p.rank}}" style="width: 28px; height: 28px; flex-shrink: 0; border-radius: 14px; background: rgba(18,18,20,0.14); display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700">{{p.rank}}</span>
        <div style="display: flex; flex-direction: column; gap: 4px; flex-grow: 1; min-width: 0">
          <span style="font-size: 21px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{p.name}}</span>
          <span style="display: flex; gap: 4px">
            <sc-if value="{{p.leading}}" hint-placeholder-val="{{ false }}">
              <span style="font-size: 11px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; background: #121214; color: #F4F4F6; padding: 3px 7px; border-radius: 8px">Leading</span>
            </sc-if>
            <sc-if value="{{p.dealer}}" hint-placeholder-val="{{ false }}">
              <span style="font-size: 11px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; border: 1.5px solid #121214; padding: 2px 6px; border-radius: 8px">Dealer</span>
            </sc-if>
          </span>
        </div>
        <button onClick="{{p.dec}}" aria-label="Minus one for {{p.name}} this round" style="width: 52px; height: 64px; flex-shrink: 0; border-radius: 16px; border: 0; background: rgba(18,18,20,0.12); color: #121214; display: flex; align-items: center; justify-content: center">
          <svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 12h14"></path></svg>
        </button>
        <div style="width: 76px; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; gap: 2px">
          <span style="{{p.totalStyle}}">{{p.shown}}</span>
          <span style="font-size: 13px; font-weight: 700; height: 16px">{{p.roundLabel}}</span>
        </div>
        <button onClick="{{p.inc}}" aria-label="Plus one for {{p.name}} this round" style="width: 52px; height: 64px; flex-shrink: 0; border-radius: 16px; border: 0; background: rgba(18,18,20,0.12); color: #121214; display: flex; align-items: center; justify-content: center">
          <svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
        </button>
      </li>
    </sc-for>
  </ol>

  <div style="flex-grow: 1"></div>

  <a href="RoundEntry.dc.html" style="height: 60px; border-radius: 20px; background: #F4F4F6; color: #0E0E11; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 19px; font-weight: 700; text-decoration: none">
    End round {{round}}
    <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg>
  </a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"sortDelay":{"editor":"range","default":900,"min":0,"max":2000,"step":100,"unit":"ms","section":"Behaviour"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      players: [
        { id: 'k', name: 'Kerryn', color: '#F37DB8', total: 14, round: 0 },
        { id: 'i', name: 'Isaac', color: '#F59A4A', total: 9, round: 0 },
        { id: 'm', name: 'Marlies', color: '#F2D35E', total: 22, round: 0 },
        { id: 't', name: 'Martin', color: '#B98AF6', total: 9, round: 0 },
        { id: 'h', name: 'Hedgehog', color: '#9CD873', total: -4, round: 0 }
      ],
      order: [], dir: 'asc', round: 5, dealer: 'm', pending: false, history: []
    };
    this.state.order = this.sorted(this.state.players, 'asc');
    this.timer = null;
  }
  componentWillUnmount() { clearTimeout(this.timer); }
  sorted(players, dir) {
    var list = players.slice();
    if (dir !== 'off') list.sort(function (a, b) { var x = a.total + a.round, y = b.total + b.round; return dir === 'asc' ? x - y : y - x; });
    return list.map(function (p) { return p.id; });
  }
  bump(id, d) {
    var self = this;
    var hist = this.state.history.concat([this.state.players]);
    var players = this.state.players.map(function (p) { return p.id === id ? Object.assign({}, p, { round: p.round + d }) : p; });
    clearTimeout(this.timer);
    this.setState({ players: players, history: hist.slice(-20), pending: this.state.dir !== 'off' });
    this.timer = setTimeout(function () {
      self.setState({ order: self.sorted(self.state.players, self.state.dir), pending: false });
    }, this.props.sortDelay ?? 900);
  }
  renderVals() {
    var s = this.state, self = this;
    var byId = {};
    s.players.forEach(function (p) { byId[p.id] = p; });
    var ordered = s.order.map(function (id) { return byId[id]; }).filter(Boolean);
    var vals = s.players.map(function (p) { return p.total + p.round; });
    var best = null;
    if (s.dir !== 'off' && !vals.every(function (x) { return x === vals[0]; })) best = s.dir === 'asc' ? Math.min.apply(null, vals) : Math.max.apply(null, vals);
    var rank = 0, prev = null;
    var players = ordered.map(function (p, i) {
      var shown = p.total + p.round;
      if (shown !== prev) { rank = i + 1; prev = shown; }
      var neg = shown < 0;
      return Object.assign({}, p, {
        shown: shown,
        rank: s.dir === 'off' ? i + 1 : rank,
        leading: best !== null && shown === best,
        dealer: p.id === s.dealer,
        roundLabel: p.round === 0 ? '' : (p.round > 0 ? '+' : '−') + Math.abs(p.round) + ' this rd',
        totalStyle: neg
          ? 'font-size: 30px; font-weight: 800; line-height: 1; background: #121214; color: #FFB4B4; border-radius: 10px; padding: 3px 8px'
          : 'font-size: 36px; font-weight: 800; line-height: 1; letter-spacing: -0.02em',
        inc: function () { self.bump(p.id, 1); },
        dec: function () { self.bump(p.id, -1); }
      });
    });
    var wilds = ['3s', '4s', '5s', '6s', '7s', '8s', '9s', '10s', 'Jacks', 'Queens', 'Kings'];
    var labels = { asc: 'Lowest first', desc: 'Highest first', off: 'Manual order' };
    return {
      players: players, round: s.round, wild: wilds[s.round - 3], pending: s.pending,
      sortLabel: labels[s.dir],
      sortAria: 'Sort order: ' + labels[s.dir] + '. Tap to change',
      cycleSort: function () {
        var next = s.dir === 'asc' ? 'desc' : s.dir === 'desc' ? 'off' : 'asc';
        clearTimeout(self.timer);
        self.setState({ dir: next, order: self.sorted(s.players, next), pending: false });
      },
      undo: function () {
        if (!s.history.length) return;
        var last = s.history[s.history.length - 1];
        clearTimeout(self.timer);
        self.setState({ players: last, history: s.history.slice(0, -1), order: self.sorted(last, s.dir), pending: false });
      }
    };
  }
}
</script>
</body>
</html>
